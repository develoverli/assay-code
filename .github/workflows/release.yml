name: Release

# Each installer is built on its own OS: a .dmg needs macOS tooling (hdiutil,
# codesign). Only a `v*` tag (or a manual run) builds them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action creates the draft release and uploads the installers to it
permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # one universal binary, so a single .dmg covers Apple silicon and Intel.
          # tsc + the bundle run out of memory on macOS, so it builds with a bare
          # `vite build` (the typecheck already runs in CI), like `pnpm build:mac`.
          #
          # createUpdaterArtifacts is switched on here and not in tauri.conf.json: it
          # needs the signing key, which only CI has, so a local `pnpm build:win` keeps working.
          - platform: macos-latest
            args: "--target universal-apple-darwin --config '{\"build\":{\"beforeBuildCommand\":\"pnpm exec vite build\"},\"bundle\":{\"createUpdaterArtifacts\":true}}'"
          - platform: ubuntu-22.04
            args: "--config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'"
          - platform: windows-latest
            args: "--config '{\"bundle\":{\"createUpdaterArtifacts\":true}}'"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk is the Linux webview; the rest is what tauri links against
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # minimumReleaseAge guards adding packages; --frozen-lockfile pins the reviewed set
      - run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      # optional: sign and notarise the macOS build; without them macOS warns on first open.
      # Only the secrets that exist are exported: tauri treats an empty APPLE_CERTIFICATE
      # as set and fails trying to import it.
      - if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__ASSAY_EOF__"; printf '%s\n' "${!name}"; echo "__ASSAY_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs every installer for the in-app updater (minisign); the public half is
          # plugins.updater.pubkey in tauri.conf.json. Missing secret = the build fails,
          # never an unsigned release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NODE_OPTIONS: ${{ matrix.platform == 'macos-latest' && '--max-old-space-size=4096' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Assay ${{ github.ref_name }}
          releaseBody: See [CHANGELOG.md](https://github.com/develoverli/assay-code/blob/main/CHANGELOG.md) for what changed.
          # still a draft: publishing it on GitHub is what sends it to every installed copy,
          # since the updater reads releases/latest, which never sees a draft
          releaseDraft: true
          prerelease: false
          # latest.json, which the updater reads; on Windows it points at the NSIS
          # installer (the one users have), not the MSI
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
